[project]
name = "purchase-request-approval-system"
version = "1.0.0"
description = "Purchase Request & Approval System with AI-powered document processing"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Django
    "django>=5.0.1,<5.1",
    "psycopg2-binary>=2.9.9",
    "python-decouple>=3.8",

    # Django REST Framework
    "djangorestframework>=3.14.0,<3.15",
    "djangorestframework-simplejwt>=5.3.1",
    "django-filter>=23.5",
    "django-cors-headers>=4.3.1",

    # API Documentation
    "drf-yasg>=1.21.7",

    # Celery & Redis
    "celery>=5.3.6,<5.4",
    "redis>=5.0.1",
    "django-redis>=5.4.0",
    "upstash-redis>=0.15.0",

    # Document Processing
    "openai>=1.12.0",
    "pypdf2>=3.0.1",
    "pdfplumber>=0.10.4",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",

    # PDF Generation
    "reportlab>=4.0.9",

    # AWS S3 (optional)
    "boto3>=1.34.34",

    # ASGI/WSGI Servers
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",

    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.1",
    "flake8>=7.0.0",
    "pytest>=7.4.4",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "django-extensions>=3.2.3",
    "ipython>=8.20.0",
]

prod = [
    "whitenoise>=6.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*", "core*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests", "static*", "media*", "templates*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["apps", "config", "core"]
skip = ["migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--cov=apps",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    ".venv",
    "venv",
]
ignore = ["E203", "E266", "W503"]
